name: Activate Unity Online

on:
  workflow_dispatch:

jobs:
  activate:
    name: Online Activation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          docker system prune -af

      - name: Prepare Directories
        run: |
          mkdir -p ${{ github.workspace }}/unity-config/Unity
          mkdir -p ${{ github.workspace }}/unity-config/UnityTechnologies

      - name: Online Activate
        run: |
          docker run --rm \
            -e UNITY_EMAIL="${{ secrets.UNITY_EMAIL }}" \
            -e UNITY_PASSWORD="${{ secrets.UNITY_PASSWORD }}" \
            -e UNITY_ORGANIZATION="mengyou456" \
            -v ${{ github.workspace }}:/project \
            -v ${{ github.workspace }}/unity-config:/root/.local/share/unity3d \
            -w /project \
            unityci/editor:ubuntu-2022.3.62f1-webgl-3.2.2 \
            bash -c '
              echo "=== Attempting online activation with organization ==="
              /opt/unity/Editor/Unity -batchmode -nographics \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -organization "mengyou456" \
                -quit -logFile - 2>&1 || true
              echo "=== License file check ==="
              find /root/.local/share/unity3d -name "*.ulf" 2>/dev/null || echo "No .ulf found"
              cat /root/.local/share/unity3d/Unity_lic.ulf 2>/dev/null || echo "No Unity_lic.ulf"
            '

      - name: Check License Files
        run: |
          echo "=== unity-config contents ==="
          find ${{ github.workspace }}/unity-config -type f 2>/dev/null
          echo "=== Looking for .ulf ==="
          find ${{ github.workspace }} -name "*.ulf" 2>/dev/null || echo "No .ulf found"

      - name: Upload License Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-online
          path: |
            ${{ github.workspace }}/*.ulf
            ${{ github.workspace }}/unity-config/
