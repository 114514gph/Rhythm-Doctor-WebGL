name: Build and Deploy WebGL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          docker system prune -af

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 2022.3.62f1
          projectPath: .
          buildsPath: build
          buildMethod: WebGLBuilder.Build
          versioning: Semantic

      - name: List build output
        run: |
          echo "=== build directory ==="
          ls -la build/ 2>/dev/null || echo "build/ not found"
          echo "=== build/WebGL directory ==="
          ls -la build/WebGL/ 2>/dev/null || echo "build/WebGL/ not found"
          find build -name "index.html" 2>/dev/null || echo "no index.html found"

      - name: Prepare Pages artifact
        run: |
          # Find the actual build output directory
          BUILD_DIR=$(find build -name "index.html" -exec dirname {} \; | head -1)
          echo "Build directory: $BUILD_DIR"
          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: Could not find build output"
            exit 1
          fi
          touch "$BUILD_DIR/.nojekyll"
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload WebGL Build (backup)
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: ${{ env.BUILD_DIR }}
          retention-days: 30
