name: Activate Unity

on:
  workflow_dispatch:

jobs:
  activate:
    name: Generate Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          docker system prune -af
          echo "Disk space after cleanup:"
          df -h /

      - name: Generate Alf File
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            unityci/editor:ubuntu-2022.3.62f1-webgl-3.2.2 \
            Unity -batchmode -nographics -createManualActivationFile -quit -logFile -

      - name: List Alf Files
        run: ls -la *.alf

      - name: Upload Alf File
        uses: actions/upload-artifact@v4
        with:
          name: unity-alf
          path: ./*.alf
